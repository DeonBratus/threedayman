<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer();

        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Освещение
        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 1).normalize();
        scene.add(light);

        // Контролы для вращения
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Анимация при движении
        controls.dampingFactor = 0.05; // Сила демпинга
        controls.rotateSpeed = 0.5; // Скорость вращения

        // Загрузка модели
        const loader = new THREE.STLLoader();
        const modelUrl = new URLSearchParams(window.location.search).get("model");

        if (modelUrl) {
            loader.load(`/api/tdim/${modelUrl}`, function (geometry) {
                const material = new THREE.MeshLambertMaterial({ color: 0x6060FF });
                const mesh = new THREE.Mesh(geometry, material);
                scene.add(mesh);

                // Центрирование модели
                mesh.geometry.computeBoundingBox();
                const bbox = mesh.geometry.boundingBox;
                const centerX = (bbox.max.x + bbox.min.x) / 2;
                const centerY = (bbox.max.y + bbox.min.y) / 2;
                const centerZ = (bbox.max.z + bbox.min.z) / 2;

                mesh.position.set(-centerX, -centerY, -centerZ);

                // Камера
                camera.position.set(0, 0, bbox.max.z * 5);
                controls.target.set(0, 0, 0); // Установка цели камеры
                controls.update();
            });
        }

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Обновление контролов
            renderer.render(scene, camera);
        }
        animate();

        // Изменение размера окна
        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Gallery</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        .gallery { display: flex; flex-wrap: wrap; gap: 20px; padding: 20px; }
        .model-card { width: 150px; text-align: center; cursor: pointer; }
        .model-card img { width: 100%; height: auto; }
        .model-card p { font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Model Gallery</h1>
    <div id="gallery" class="gallery"></div>

    <script>
        async function loadModels() {
            try {
                const response = await fetch('/api/tdim/');
                if (!response.ok) {
                    throw new Error('Failed to fetch models');
                }

                const models = await response.json();

                if (!Array.isArray(models) || models.length === 0) {
                    alert('No models found');
                    return;
                }

                const galleryElement = document.getElementById('gallery');
                models.forEach(model => {
                    const modelCard = document.createElement('div');
                    modelCard.classList.add('model-card');

                    // Для изображений в галерее можем использовать какие-то заглушки,
                    // если модели не имеют своих миниатюр, либо просто показывать название.
                    modelCard.innerHTML = `
                        <img src="https://via.placeholder.com/150" alt="${model.filename}">
                        <p>${model.filename}</p>
                    `;
                    modelCard.addEventListener('click', () => {
                        window.location.href = `model-viewer.html?model=${model.filename}`;
                    });
                    galleryElement.appendChild(modelCard);
                });
            } catch (error) {
                console.error('Error loading models:', error);
                alert('Error loading models: ' + error.message);
            }
        }

        loadModels();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Project</title>
  <link rel="stylesheet" href="styles/gallery_styles.css">
</head>
<body>
  <!-- Шапка сайта -->
  <header>
    <div class="logo">
      <h1><a href="/static/gallery.html">NetPrint Studio</a></h1>
    </div>
    <nav>
      <ul>
        <li><a href="/static/printers-manager.html">Printers</a></li>
        <li><a href="/static/create_project.html">Create Project</a></li>
        <li><a href="/static/upload.html">Upload Model</a></li>
      </ul>
    </nav>
  </header>

  <div class="container-proj">
    <!-- Форма для создания проекта -->
    <div class="create-project-form">
      <h2>Create New Project</h2>
      <form id="createProjectForm" enctype="multipart/form-data">
        <div class="form-group">
          <label for="projname">Project Name:</label>
          <input type="text" id="projname" name="projname" required>
        </div>
        <div class="form-group">
          <label for="pic">Project Image:</label>
          <input type="file" id="pic" name="pic" accept="image/*" required>
        </div>
        <button type="submit">Create Project</button>
      </form>
      <div id="responseMessage"></div>
    </div>
  </div>

  <script src="create_project.js"></script>
</body>
</html>

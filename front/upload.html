<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Загрузка модели</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
        }

        input, textarea, button, select {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px;
        }

        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }

        .button-home {
            background-color: #007bff;
            margin-top: 10px;
        }

        .button-home:hover {
            background-color: #0056b3;
        }

        textarea {
            resize: vertical;
            height: 100px;
        }

        #message {
            margin-top: 20px;
            text-align: center;
        }

        .preview {
            display: block;
            margin-top: 10px;
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            padding: 5px;
        }

        #remove-preview {
            cursor: pointer;
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }

        .project-option {
            display: flex;
            align-items: center;
        }

        .project-option img {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Загрузите модель</h1>
        <form id="upload-form" enctype="multipart/form-data">
            <!-- Превью изображения -->
            <div id="preview-container" style="text-align: center;">
                <img id="preview-img" class="preview" style="display:none;" alt="Предпросмотр изображения" />
                <br>
                <input type="file" id="prewiev-picture" name="prewiev-picture" required><br><br>
                <span id="remove-preview" onclick="removePreview()">Удалить превью</span>
            </div>

            <!-- Название проекта (выбор из списка) -->
            <label for="proj_name">Название проекта:</label>
            <select id="proj_name" name="proj_name" required>
                <!-- Сюда будет добавляться список проектов -->
            </select><br><br>

            <!-- Название модели -->
            <label for="filename">Имя модели:</label>
            <input type="text" id="filename" name="filename" required><br><br>

            <!-- Файл модели -->
            <label for="td-file">Файл модели:</label>
            <input type="file" id="td-file" name="td-file" required><br><br>

            <!-- Описание -->
            <label for="desc">Описание:</label>
            <textarea id="desc" name="desc" required></textarea><br><br>
            
            <!-- Кнопка отправки формы -->
            <button type="submit">Загрузить</button>
        </form>

        <!-- Кнопка Домой -->
        <a href="/static/gallery.html" class="button-home" onclick="goHome()">Домой</a>

        <div id="message"></div>
    </div>

    <script>
        // Функция для загрузки списка проектов
        async function loadProjects() {
            try {
                const response = await fetch('/api/proj/list');
                if (!response.ok) {
                    throw new Error('Ошибка при загрузке проектов');
                }

                const projects = await response.json();
                const projSelect = document.getElementById("proj_name");

                // Заполнение выпадающего списка проектами
                projects.forEach(project => {
                    const option = document.createElement("option");
                    option.value = project.projname;  // Используем имя проекта как значение

                    // Создание элемента для отображения проекта с картинкой
                    const optionContent = document.createElement('div');
                    optionContent.classList.add('project-option');

                    const projectImg = document.createElement('img');
                    projectImg.src = project.picture_path;
                    projectImg.alt = project.projname;
                    optionContent.appendChild(projectImg);

                    const projectName = document.createElement('span');
                    projectName.textContent = project.projname;
                    optionContent.appendChild(projectName);

                    // Добавляем элементы в option
                    const optionWrapper = document.createElement('option');
                    optionWrapper.value = project.projname;  // Устанавливаем имя проекта в качестве значения
                    optionWrapper.innerHTML = optionContent.innerHTML;  // Вставляем содержимое

                    projSelect.appendChild(optionWrapper);
                });
            } catch (error) {
                console.error('Ошибка при загрузке проектов:', error);
                const messageDiv = document.getElementById("message");
                messageDiv.innerHTML = `<p style="color: red;">Ошибка при загрузке списка проектов.</p>`;
            }
        }

        // Загружаем проекты при загрузке страницы
        window.onload = loadProjects;

        // Функция для отображения превью изображения
        document.getElementById("prewiev-picture").addEventListener("change", function(event) {
            const file = event.target.files[0];
            const previewImg = document.getElementById("preview-img");
            const removePreview = document.getElementById("remove-preview");

            if (file) {
                const reader = new FileReader();

                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';  // Показываем изображение
                    removePreview.style.display = 'inline';  // Показываем кнопку удаления
                };

                reader.readAsDataURL(file);
            } else {
                previewImg.style.display = 'none';  // Скрываем изображение, если файл не выбран
                removePreview.style.display = 'none';  // Скрываем кнопку удаления
            }
        });

        // Функция для удаления превью
        function removePreview() {
            const previewImg = document.getElementById("preview-img");
            const removePreview = document.getElementById("remove-preview");
            const previewInput = document.getElementById("prewiev-picture");

            previewImg.style.display = 'none';  // Скрываем изображение
            removePreview.style.display = 'none';  // Скрываем кнопку удаления

            // Очищаем выбранный файл
            previewInput.value = '';
        }

        document.getElementById("upload-form").addEventListener("submit", async function(event) {
            event.preventDefault();  // Отменяем стандартное поведение формы

            // Получаем значения полей формы
            const projName = document.getElementById("proj_name").value;  // Теперь передаем имя проекта
            const filename = document.getElementById("filename").value;
            const desc = document.getElementById("desc").value;
            const tdFile = document.getElementById("td-file").files[0];
            const previewPicture = document.getElementById("prewiev-picture").files[0];

            // Создаём объект FormData для остальных данных (не для filename)
            const formData = new FormData();
            formData.append("proj_name", projName);  // Добавляем имя проекта
            formData.append("desc", desc);
            formData.append("td_file", tdFile);
            formData.append("prewiev_picture", previewPicture);

            // Формируем URL с query-параметром filename
            const url = `/api/tdim/?filename=${encodeURIComponent(filename)}&desc=${encodeURIComponent(desc)}&proj_name=${encodeURIComponent(projName)}`;
            // Отправляем POST запрос на сервер с query-параметром и FormData в теле запроса
            const response = await fetch(url, {
                method: "POST",
                body: formData
            });

            const messageDiv = document.getElementById("message");

            if (response.ok) {
                const data = await response.json();
                messageDiv.innerHTML = `
                    <p>Модель успешно загружена!</p>
                    <p>Имя модели: ${data.filename}</p>
                    <p>Описание: ${data.desc}</p>
                    <p>Файл: ${data.raw_filename}</p>
                    <p>Предпросмотр: ${data.picture_path}</p>
                `;
            } else {
                // Преобразуем объект ошибки в строку
                const errorData = await response.json();
                messageDiv.innerHTML = `<p style="color: red;">Ошибка: ${JSON.stringify(errorData)}</p>`;
            }
        });

        // Функция для перехода на главную страницу
        function goHome() {
            window.location.href = '/';  // Переход на домашнюю страницу
        }
    </script>
</body>
</html>

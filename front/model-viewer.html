<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Viewer</title>
    <link rel="stylesheet" href="styles/viewer_styles.css">
</head>
<body>
    <!-- Навигация -->
    <div id="navigation-placeholder"></div>

    <!-- Основной контейнер -->
    <div class="container">
        <!-- Название модели -->
        <h1 id="model-title">3D Model Viewer</h1>

        <!-- Блок просмотра модели и параметров -->
        <div class="viewer-block">
            <!-- Модель -->
            <div id="viewer-container">
                <div id="viewer"></div>
            </div>

            <!-- Параметры -->
            <div class="parameters">
                <div class="info-row">
                    <span>Uploaded Date:</span>
                    <span id="upload-date">N/A</span>
                </div>
                <div class="info-row">
                    <span>Type:</span>
                    <span id="file-type">N/A</span>
                </div>
                <div class="info-row">
                    <span>Size:</span>
                    <span id="file-size">N/A</span>
                </div>

                <!-- Кнопка для скачивания -->
                <button id="download-button" class="download-button">Download Model</button>
            </div>
        </div>

        <!-- Блок описания -->
        <div class="description" id="model-description">Description not available.</div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/loaders/STLLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three/examples/js/controls/OrbitControls.js"></script>
    <script src="viewer.js" defer></script>
    <script>
        // Загрузка навигации
        fetch('navigation.html')
            .then(response => response.text())
            .then(html => {
                document.getElementById('navigation-placeholder').innerHTML = html;
            });
    </script>
</body>
</html>
